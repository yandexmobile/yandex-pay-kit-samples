name: quick_pay_sample
description: QuickPay Flutter sample application
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  # New package name — includes both new API and legacy YandexQuickPay back-compat.
  # yandex_pay_core is pulled transitively.
  yandex_pay_quickpay: 2.1.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
